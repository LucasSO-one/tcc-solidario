name: Run EF Core Migrations

on:
  push:
    branches:
      - main

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore

      - name: Instalar EF Core CLI
        run: dotnet tool install --global dotnet-ef

      - name: Forçar IPv4 no host do Supabase
        run: |
          RESOLVED=$(dig +short A db.wqgrxpnjelgixasitbzo.supabase.co | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "IP resolvido: $RESOLVED"
          if [ -z "$RESOLVED" ]; then
            echo "SUPABASE_IPV4=db.wqgrxpnjelgixasitbzo.supabase.co" >> $GITHUB_ENV
          else
            echo "SUPABASE_IPV4=$RESOLVED" >> $GITHUB_ENV
          fi

      - name: Rodar migrations
        run: dotnet ef database update --project api/TccSolidario.Api
        env:
          ConnectionStrings__DefaultConnection: "Host=${{ env.SUPABASE_IPV4 }};Port=5432;Database=postgres;Username=postgres;Password=${{ secrets.DB_PASSWORD }};SSL Mode=Require;Trust Server Certificate=true"
          Jwt__Key: ${{ secrets.JWT_KEY }}