name: Migrations de produção (manual)
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet tool restore
      - run: dotnet restore api/TccSolidario.Api
      # Configure aprovação no environment production e execute preflight/backup antes.
      - name: Aplicar migrations com credencial exclusiva de manutenção
        run: dotnet ef database update --project api/TccSolidario.Api
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_MIGRATION_CONNECTION }}
